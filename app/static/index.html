<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invoice Desk</title>
  <meta name="description" content="Invoice Desk turns a vendor invoice PDF into a reasoned accounts-payable decision.">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="m9 14 2 2 4-4"/></svg>
        </span>
        <span>
          <span class="brand-name">Invoice Desk</span>
          <span class="brand-sub">PDF to decision</span>
        </span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="#/" data-nav="process">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.1z"/></svg>
          Process
        </a>
        <a href="#/runs" data-nav="runs">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          Dashboard
          <span class="nav-badge" id="nav-pending" hidden></span>
        </a>
        <a href="#/pos" data-nav="pos">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg>
          Purchase orders
        </a>
        <a href="#/policy" data-nav="policy">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>
          Policy
        </a>
      </nav>
      <div class="sidebar-foot">
        <div class="foot-block">
          <div class="foot-label">Working for</div>
          <div class="foot-value" id="foot-buyer">…</div>
        </div>
        <div class="foot-block">
          <div class="foot-label">Field reader</div>
          <div class="foot-value" id="foot-reader">…</div>
        </div>
        <button class="btn btn-ghost btn-sm btn-block" id="reset-btn" type="button">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
          Reset demo data
        </button>
      </div>
    </aside>
    <main class="main" id="view" tabindex="-1"></main>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="modal-backdrop" id="modal" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
